<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Адина — AI Hub</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="src/ui/app.css">
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M12 5.2c-2.6 1.1-4 3.6-4 6.4 0 3.2 1.8 5.9 4 7.2 2.2-1.3 4-4 4-7.2 0-2.8-1.4-5.3-4-6.4z" fill="currentColor" opacity=".9"/></svg>
        <span id="name">Адина</span>
        <span class="sub">AI Hub</span>
      </div>
      <div id="chips" class="chips"></div>
      <div class="top-right">
        <span id="fps" class="fps"></span>
        <button id="btn-settings" class="icon-btn" title="Настройки (S)" aria-label="Настройки">
          <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/><circle cx="16" cy="7" r="2.2" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="8" cy="17" r="2.2" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
        </button>
      </div>
    </header>

    <main class="stage">
      <section class="pane pane-avatar">
        <div class="backdrop"></div>
        <div id="avatar-mount" class="avatar-mount"></div>
        <div class="fade-bottom"></div>
      </section>
      <div class="divider"></div>
      <section class="pane pane-view">
        <canvas id="matrix"></canvas>
        <div id="viewport-overlay" class="overlay"></div>
        <div class="vignette"></div>
        <button id="btn-filter" class="view-btn" type="button" title="Включить / выключить фильтр «Матрица» (M)">Фильтр «Матрица»: вкл</button>
        <div id="viewport-label" class="tag" data-live="0">ОЖИДАНИЕ СИГНАЛА</div>
        <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
      </section>
    </main>

    <div id="caption" class="caption" data-role="assistant"><span class="who"></span><span class="text"></span></div>

    <aside id="drawer" class="drawer" aria-label="Настройки">
      <div class="drawer-head">
        <h2>Настройки движка</h2>
        <button id="drawer-close" class="icon-btn" aria-label="Закрыть"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
      </div>
      <nav id="drawer-tabs" class="tabs"></nav>
      <div id="drawer-body" class="drawer-body"></div>
    </aside>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
